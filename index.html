<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick and Morty API</title>

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">

    <div class="container bg-info mt-5 p-4 rounded">

        <h1 class="text-center mb-4">
            Personajes de Rick and Morty
        </h1>

        <!-- CARD PERSONAJE ALEATORIO -->
        <div class="row mb-4 justify-content-center">

            <div class="col-md-4">

                <div class="card text-dark">

                    <div class="card-header text-center">

                        <img id="imagen" src="" alt="" class="img-fluid rounded">

                    </div>

                    <div class="card-body text-center">

                        <h4 class="card-title" id="nombre">
                            Nombre Personaje
                        </h4>

                        <p id="id_personaje">
                            ID personaje
                        </p>

                        <button onclick="GenerarPersonaje()" class="btn btn-success">
                            Generar Personaje
                        </button>

                    </div>

                </div>

            </div>

        </div>

        <!-- PERSONAJES -->
        <div class="row border p-3" id="personajes">

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
